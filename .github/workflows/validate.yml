name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The metrics tests build repositories with pinned history, and the
          # self-validation reads the git index for hook permissions.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Validate
        run: make validate

      - name: Test
        run: make test

  no-dependencies:
    # The package must run from a fresh clone with nothing installed. This job
    # fails if a runtime dependency creeps in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 scripts/adoption.py
      - run: python3 scripts/mcp-sync.py --check

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n governance/hooks/*.sh
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning governance/hooks/*.sh || true
