[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dlc"
version = "0.2.0"
description = "Cross-platform Agent Skills and MCP templates for the AI-Native SDLC"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "AI-DLC contributors" }
]
keywords = ["ai", "sdlc", "agent-skills", "mcp", "claude", "codex", "copilot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-dlc = "ai_dlc.cli:main"

[project.urls]
Homepage = "https://github.com/AgentiqueWorks/ai-dlc"
Repository = "https://github.com/AgentiqueWorks/ai-dlc"