# Generated by `ai-dlc mcp-sync` from mcp/configs/*.json. Do not edit by hand.
# Merge these tables into ~/.codex/config.toml.

[mcp_servers.confluence]
url = "https://mcp.atlassian.com/v1/sse"

[mcp_servers.confluence.http_headers]
"Authorization" = "Bearer ${ATLASSIAN_TOKEN}"

[mcp_servers.datadog]
command = "npx"
args = ["-y", "@vineethnkrishnan/datadog-mcp"]

[mcp_servers.datadog.env]
"DD_API_KEY" = "${DATADOG_API_KEY}"
"DD_APP_KEY" = "${DATADOG_APP_KEY}"
"DD_SITE" = "${DATADOG_SITE:-datadoghq.com}"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.figma.http_headers]
"Authorization" = "Bearer ${FIGMA_TOKEN}"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp"

[mcp_servers.github.http_headers]
"Authorization" = "Bearer ${GITHUB_TOKEN}"

[mcp_servers.gitlab]
command = "npx"
args = ["-y", "@yoda-digital/mcp-gitlab-server"]

[mcp_servers.gitlab.env]
"GITLAB_TOKEN" = "${GITLAB_TOKEN}"
"GITLAB_URL" = "${GITLAB_URL:-https://gitlab.com}"

